[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pico-uart-sniffer"
version = "0.1.0"
description = "Passive UART sniffer bridge and MCP server for the Raspberry Pi Pico"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pico-uart-sniffer contributors" }]
keywords = ["uart", "sniffer", "serial", "pico", "rp2040", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "pyserial>=3.5",
  "mcp[cli]>=1.0",
]

[project.scripts]
uart-sniffer = "uart_sniffer.cli:main"
uart-sniffer-mcp = "uart_sniffer.mcp_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uart_sniffer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
